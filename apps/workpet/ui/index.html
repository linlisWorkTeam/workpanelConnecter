<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>WorkPet Live2D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="pet-shell" data-state="loading">
    <header class="topbar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span id="statusDot" class="status-dot" aria-hidden="true"></span>
        <span id="petName">WorkPet</span>
      </div>
      <div class="top-actions">
        <div class="size-control" aria-label="调整桌宠大小">
          <button id="sizeDownBtn" class="icon-btn size-btn" type="button" title="缩小桌宠" aria-label="缩小桌宠">A−</button>
          <button id="sizeUpBtn" class="icon-btn size-btn" type="button" title="放大桌宠" aria-label="放大桌宠">A+</button>
        </div>
        <button id="chatToggle" class="icon-btn" type="button" title="打开聊天" aria-label="打开聊天">
          <span aria-hidden="true">✦</span>
        </button>
        <button id="collapseBtn" class="icon-btn is-hidden" type="button" title="收起聊天" aria-label="收起聊天">
          <span aria-hidden="true">−</span>
        </button>
      </div>
    </header>

    <section id="petStage" class="pet-stage" aria-label="Live2D 桌宠">
      <canvas id="live2dCanvas"></canvas>
      <div id="fallbackPet" class="fallback-pet" aria-hidden="true">
        <div class="fallback-glow"></div>
        <img src="skin.svg" alt="" draggable="false" />
      </div>
      <div id="loadingHint" class="loading-hint">正在唤醒桌宠…</div>
      <button id="petHit" class="pet-hit" type="button" aria-label="和桌宠互动"></button>
      <div id="speechBubble" class="speech-bubble is-hidden" role="status"></div>
      <button id="openChatBtn" class="chat-fab" type="button">
        <span aria-hidden="true">⌁</span>
        <span>聊一聊</span>
      </button>
    </section>

    <section id="panel" class="chat-panel is-hidden" aria-label="聊天面板">
      <div class="panel-head">
        <div>
          <p class="eyebrow">CONNECTED SPACE</p>
          <select id="groupSelect" class="group-select" aria-label="切换群聊"></select>
        </div>
        <span id="connectionBadge" class="connection-badge">未连接</span>
      </div>
      <div id="memberStrip" class="member-strip" aria-label="群成员"></div>
      <div id="msgList" class="msg-list" aria-live="polite"></div>
      <form id="composer" class="panel-foot">
        <input id="input" class="input" type="text" list="agentMentions" placeholder="对 WorkPanel 说点什么…" autocomplete="off" />
        <datalist id="agentMentions"></datalist>
        <button id="sendBtn" class="send-btn" type="submit" aria-label="发送消息">
          <span>发送</span><span aria-hidden="true">↗</span>
        </button>
      </form>
    </section>
  </main>

  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
