[package]
name = "workpet"
version = "0.1.0"
description = "WorkPet 猫猫球 — WorkPanel 桌宠入口"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
